<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TwinVolt Universal Battery Digital Twin Platform — Real-Time Visualization Dashboard" />
  <title>TwinVolt — Universal Battery Digital Twin Platform</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/charts.css" />
</head>
<body>
  <div id="app-shell">
    <!-- Header -->
    <header id="app-header">
      <div class="header-brand">
        <img src="assets/logo.svg" alt="TwinVolt Logo" class="brand-logo" />
        <span class="brand-title">TwinVolt</span>
        <span class="brand-tag" id="header-version">API v—</span>
      </div>

      <div class="header-center">
        <div class="twin-selector-group">
          <span class="selector-label">Twin</span>
          <select id="header-twin-select" class="twin-select">
            <option value="">Loading twins...</option>
          </select>
        </div>
      </div>

      <div class="header-status">
        <a href="/ui/landing.html" class="header-landing-link" title="Platform Overview">
          <span>Platform Overview</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>
        <div id="header-mode-badge" class="mode-pill mode-idle">
          <span class="mode-dot"></span>
          <span id="header-mode-text">IDLE</span>
        </div>
        <div class="latency-readout" id="latency-readout" hidden>
          <span>Latency:</span>
          <span id="header-latency">—</span>
        </div>
        <div id="header-ws-status" class="status-pill disconnected">
          <span class="indicator-dot"></span>
          DISCONNECTED
        </div>
      </div>
    </header>

    <!-- Navigation Sidebar -->
    <aside id="app-sidebar">
      <nav aria-label="Primary navigation">
        <ul class="nav-list">
          <li>
            <button class="nav-item-btn active" data-view="overview" aria-label="Overview View">
              <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              <span class="nav-label">Overview</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="telemetry" aria-label="Live Telemetry View">
              <svg class="nav-icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
              <span class="nav-label">Live Telemetry</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="hardware" aria-label="Hardware and Arduino View">
              <svg class="nav-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M9 9h6v6H9z"></path><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"></path></svg>
              <span class="nav-label">Hardware & Arduino</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="mock" aria-label="Mock Generator Mode">
              <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
              <span class="nav-label">Mock Generator</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="twin" aria-label="Digital Twin View">
              <svg class="nav-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
              <span class="nav-label">Digital Twin</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="estimation" aria-label="State Estimation View">
              <svg class="nav-icon" viewBox="0 0 24 24"><path d="M18 20V10"></path><path d="M12 20V4"></path><path d="M6 20v-6"></path></svg>
              <span class="nav-label">Estimation</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="replay" aria-label="Replay and Evaluation View">
              <svg class="nav-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <span class="nav-label">Replay & Eval</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="events" aria-label="Domain Event Log View">
              <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
              <span class="nav-label">Event Log</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="diagnostics" aria-label="Explainable Diagnostics View">
              <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
              <span class="nav-label">Diagnostics</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="benchmarking" aria-label="Experimental Benchmarking View">
              <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
              <span class="nav-label">Benchmarking</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="datasets" aria-label="Dataset Lab">
              <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"></path><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
              <span class="nav-label">Dataset Lab</span>
            </button>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div>TwinVolt Platform</div>
        <div>Universal Battery Twin</div>
        <a href="/ui/landing.html" class="sidebar-overview-link">Platform Overview &rarr;</a>
      </div>
    </aside>

    <!-- Main Viewport Area -->
    <main id="app-main">
      <div id="view-overview" class="view-container active"></div>
      <div id="view-telemetry" class="view-container"></div>
      <div id="view-hardware" class="view-container"></div>
      <div id="view-mock" class="view-container"></div>
      <div id="view-twin" class="view-container"></div>
      <div id="view-estimation" class="view-container"></div>
      <div id="view-replay" class="view-container"></div>
      <div id="view-events" class="view-container"></div>
      <div id="view-diagnostics" class="view-container"></div>
      <div id="view-benchmarking" class="view-container"></div>
      <div id="view-datasets" class="view-container"></div>
    </main>
  </div>

  <!-- Runtime Configuration Bridge (must load before main application script) -->
  <!-- In production Vercel deployments, deploy scripts/build-config.py to inject backend URLs. -->
  <!-- In local dev / Docker, this script is a no-op and relative URLs are used. -->
  <script src="js/config.js"></script>

  <!-- Entry Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
